name: flutter_ui
description: "A new Flutter project."

# Prevents accidental publication to pub.dev
publish_to: 'none'

# Application versioning
version: 1.0.0+1

# Dart SDK version
environment:
  sdk: ^3.6.1

# Project dependencies
dependencies:
  flutter:
    sdk: flutter

  # Additional dependencies
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.9  # Use the latest version of flutter_svg
  google_fonts: ^6.1.0  # Use the latest version of google_fonts

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

# Flutter-specific configurations
flutter:
  uses-material-design: true

  # Adding assets (images, fonts, etc.)
  assets:
    - assets/images/kamar_tidur.jpg
    - assets/images/meja_makan.jpg
    - assets/images/meja_tamu.jpg
    - assets/images/ruang_tamu.jpg
    - assets/images/furniture/
    - assets/icons/
    